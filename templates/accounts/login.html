{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · {{ SITE_TITLE }}</title>
    <link rel="stylesheet" href="{% static 'css/dist.css' %}">
    <link rel="stylesheet" href="{% static 'css/inter-font.css' %}">
    <style>
        body { font-family: 'Inter', sans-serif; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-900 relative overflow-hidden">
    <div class="absolute inset-0 opacity-30">
        <div class="absolute top-0 left-0 w-96 h-96 bg-indigo-600 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-violet-600 rounded-full blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md px-6">
        <div class="bg-white/10 backdrop-blur-xl rounded-2xl border border-white/10 shadow-2xl p-8">
            <div class="text-center mb-8">
                <span class="inline-block animate-float filter drop-shadow-[0_0_25px_rgba(16,185,129,0.3)]">
                    <img src="{% static 'images/logo.svg' %}" alt="{{ SITE_HEADER }}" class="mx-auto h-28 w-auto mb-4 opacity-90">
                </span>
                <h1 class="text-white text-2xl font-extrabold">{{ SITE_HEADER }}</h1>
                <!-- <p class="text-indigo-300 font-semibold tracking-wide mt-1">{{ SITE_TITLE }} · {{ SITE_INDEX_TITLE }}</p> -->
            </div>

            {% if form.errors %}
            <div class="mb-4 px-4 py-3 rounded-lg bg-red-500/20 border border-red-400/40 text-red-200 text-sm">
                Invalid login credentials. Please try again.
            </div>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">{{ form.identifier.label }}</label>
                    {{ form.identifier }}
                    {{ form.username }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5" for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
                    <div class="relative">
                        {{ form.password }}
                        <button type="button" id="togglePasswordBtn"
                                class="absolute top-1/2 right-0 px-3 -translate-y-1/2 text-slate-500 hover:text-slate-700 transition cursor-pointer"
                                tabindex="-1" aria-label="Show password">
                            <!-- eye (visible) -->
                            <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <!-- eye-off (hidden) -->
                            <svg class="eye-off w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit"
                        class="w-full py-3 rounded-lg bg-gradient-to-r from-indigo-500 to-violet-600 text-white font-bold hover:opacity-90 transition">
                    Sign In
                </button>
            </form>
        </div>
        <!-- <p class="text-center text-slate-500 text-xs mt-6">{{ SITE_TITLE }} &middot; {{ SITE_INDEX_TITLE }}</p> -->
    </div>
    <script>
    (function() {
        var input = document.getElementById('id_password');
        var btn = document.getElementById('togglePasswordBtn');
        if (!input || !btn) return;
        function toggle() {
            var isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            var eyeOpen = btn.querySelector('.eye-open');
            var eyeOff = btn.querySelector('.eye-off');
            if (eyeOpen) eyeOpen.classList.toggle('hidden', isHidden);
            if (eyeOff) eyeOff.classList.toggle('hidden', !isHidden);
            btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        }
        btn.addEventListener('click', toggle);
        // keep global for compatibility
        window.togglePassword = function(inputId, b) {
            var el = document.getElementById(inputId) || input;
            var button = b || btn;
            var hidden = el.type === 'password';
            el.type = hidden ? 'text' : 'password';
            var o = button.querySelector('.eye-open');
            var off = button.querySelector('.eye-off');
            if (o) o.classList.toggle('hidden', hidden);
            if (off) off.classList.toggle('hidden', !hidden);
        };
    })();
    </script>
</body>
</html>
