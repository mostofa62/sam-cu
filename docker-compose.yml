services:
  web:
    build:
      context: .
    container_name: hsm_web
    restart: unless-stopped
    command: gunicorn hsm.wsgi:application --bind 0.0.0.0:8000 --workers 2
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-cg%v6itz2tdc_)3o(se92@r)u_2=b0x9=an%l2t(ce4-(z5bvv}
      BASE_PATH: ${BASE_PATH:-sam}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://proto.cu.ac.bd}
      POSTGRES_DB: ${POSTGRES_DB:-hallseatmanagment}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "9005:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

    labels:
      - "traefik.enable=true"

      # https://proto.cu.ac.bd/sam
      - "traefik.http.routers.hsm.rule=Host(`proto.cu.ac.bd`) && PathPrefix(`/sam`)"
      - "traefik.http.routers.hsm.entrypoints=websecure"
      - "traefik.http.routers.hsm.tls=true"
      - "traefik.http.routers.hsm.tls.certresolver=letsencrypt"

      # Remove /sam before forwarding to Django
      - "traefik.http.middlewares.hsm-strip.stripprefix.prefixes=/sam"
      - "traefik.http.routers.hsm.middlewares=hsm-strip"

      # Gunicorn internal port
      - "traefik.http.services.hsm.loadbalancer.server.port=8000"

volumes:
  static_volume:
  media_volume:

networks:
  proxy:
    external: true