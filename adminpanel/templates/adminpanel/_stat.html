<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-{{ color }}-100 text-{{ color }}-600 flex items-center justify-center flex-shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="{{ icon }}"/></svg>
        </div>
        <div class="min-w-0">
            <p class="text-xs font-bold uppercase tracking-wide text-slate-400">{{ label }}</p>
            <p class="text-2xl font-extrabold text-slate-800 leading-tight">{{ value }}</p>
        </div>
    </div>
</div>
